<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>특수각 삼각비 짝맞추기</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Pretendard", "Noto Sans KR", sans-serif;
    background: #f5f7fb;
    color: #222;
}

.container {
    width: min(900px, 94%);
    margin: 30px auto;
}

.top {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.info {
    background: white;
    border: 1px solid #ddd;
    border-radius: 15px;
    padding: 15px;
    text-align: center;
}

.info-title {
    font-size: 14px;
    color: #777;
    margin-bottom: 5px;
}

.info-value {
    font-size: 28px;
    font-weight: 800;
}

.game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
}

.round {
    font-weight: 800;
    font-size: 20px;
}

.rule {
    font-size: 14px;
    color: #666;
    margin-top: 5px;
}

button {
    font-family: inherit;
}

.restart {
    border: 1px solid #ccc;
    background: white;
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
}

.board {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
}

.column-title {
    text-align: center;
    font-weight: 800;
    margin-bottom: 10px;
}

.cards {
    display: grid;
    gap: 12px;
}

.card {
    width: 100%;
    height: 90px;

    border: 2px solid #d8dce5;
    border-radius: 15px;

    background: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 24px;
    font-weight: 800;

    cursor: pointer;

    transition:
        transform 0.12s,
        border-color 0.12s,
        background 0.12s;
}

.card:hover:not(:disabled) {
    transform: translateY(-2px);
    border-color: #758cff;
}

.card:active:not(:disabled) {
    transform: scale(0.98);
}

.selected {
    border-color: #4b66ff;
    background: #eef1ff;
}

.correct {
    opacity: 0.35;
    pointer-events: none;
}

.wrong {
    animation: shake 0.25s;
    border-color: #e34d59;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-7px); }
    75% { transform: translateX(7px); }
}

.message {
    text-align: center;
    min-height: 40px;
    margin-top: 18px;
    font-size: 19px;
    font-weight: 800;
}

.bomb {
    font-size: 35px;
}

.bomb-text {
    font-size: 16px;
    margin-left: 8px;
}

/* 수학 표현 */

.math {
    display: inline-flex;
    justify-content: center;
    align-items: center;

    font-family: "Times New Roman", serif;
    font-size: 32px;
}

.frac {
    display: inline-flex;
    flex-direction: column;
    align-items: center;

    line-height: 1;
    min-width: 45px;
}

.frac-top {
    width: 100%;
    padding: 0 6px 4px;
    text-align: center;
    border-bottom: 2px solid currentColor;
}

.frac-bottom {
    padding-top: 4px;
}

.sqrt {
    display: inline-flex;
    align-items: flex-start;
}

.sqrt-symbol {
    font-size: 1.25em;
    line-height: 0.95;
    margin-right: -2px;
}

.radicand {
    border-top: 2px solid currentColor;
    padding: 1px 3px 0 3px;
}

/* 결과창 */

.result {
    display: none;

    margin-top: 20px;
    padding: 25px;

    border-radius: 15px;
    border: 1px solid #ddd;
    background: white;

    text-align: center;
}

.result.show {
    display: block;
}

.result-title {
    font-size: 25px;
    font-weight: 900;
    margin-bottom: 10px;
}

.result-score {
    font-size: 22px;
}

.again {
    margin-top: 18px;
    border: none;
    background: #4b66ff;
    color: white;
    padding: 12px 20px;
    border-radius: 10px;
    font-weight: 800;
    cursor: pointer;
}

@media (max-width: 600px) {

    .container {
        width: 96%;
    }

    .card {
        height: 75px;
        font-size: 19px;
    }

    .math {
        font-size: 27px;
    }

    .rule {
        font-size: 12px;
    }

}
</style>
</head>

<body>

<div class="container">

    <div class="top">

        <div class="info">
            <div class="info-title">남은 시간</div>
            <div id="time" class="info-value">2:00</div>
        </div>

        <div class="info">
            <div class="info-title">점수</div>
            <div id="score" class="info-value">0</div>
        </div>

        <div class="info">
            <div class="info-title">맞힌 문제</div>
            <div id="correctCount" class="info-value">0</div>
        </div>

    </div>


    <div class="game-header">

        <div>
            <div id="round" class="round">
                1세트
            </div>

            <div class="rule">
                2초 이내 10점 · 이후 점수 감소 · 최저 5점 · 오답 시 제한시간 -3초
            </div>
        </div>

        <button id="restart" class="restart">
            다시 시작
        </button>

    </div>


    <div id="board" class="board">

        <div>

            <div class="column-title">
                삼각비
            </div>

            <div id="leftCards" class="cards"></div>

        </div>


        <div>

            <div class="column-title">
                값
            </div>

            <div id="rightCards" class="cards"></div>

        </div>

    </div>


    <div id="message" class="message"></div>


    <div id="result" class="result">

        <div class="result-title">
            ⏱ 게임 종료!
        </div>

        <div class="result-score">
            최종 점수
            <strong id="finalScore">0</strong>점
        </div>

        <div style="margin-top:8px;">
            총
            <strong id="finalCorrect">0</strong>
            문제를 맞혔습니다.
        </div>

        <button id="playAgain" class="again">
            다시 도전
        </button>

    </div>

</div>


<script>

/* ==============================
   문제 데이터
================================ */

const problems = [

    {
        expression: "sin 30°",
        key: "half"
    },

    {
        expression: "cos 60°",
        key: "half"
    },

    {
        expression: "sin 45°",
        key: "sqrt2half"
    },

    {
        expression: "cos 45°",
        key: "sqrt2half"
    },

    {
        expression: "sin 60°",
        key: "sqrt3half"
    },

    {
        expression: "cos 30°",
        key: "sqrt3half"
    },

    {
        expression: "tan 30°",
        key: "sqrt3third"
    },

    {
        expression: "tan 45°",
        key: "one"
    },

    {
        expression: "tan 60°",
        key: "sqrt3"
    }

];


const answerKeys = [

    "half",
    "sqrt2half",
    "sqrt3half",
    "sqrt3third",
    "one",
    "sqrt3"

];


/* ==============================
   HTML 요소
================================ */

const leftCards =
    document.getElementById("leftCards");

const rightCards =
    document.getElementById("rightCards");

const timeElement =
    document.getElementById("time");

const scoreElement =
    document.getElementById("score");

const correctElement =
    document.getElementById("correctCount");

const roundElement =
    document.getElementById("round");

const message =
    document.getElementById("message");

const board =
    document.getElementById("board");

const result =
    document.getElementById("result");

const finalScore =
    document.getElementById("finalScore");

const finalCorrect =
    document.getElementById("finalCorrect");


/* ==============================
   게임 상태
================================ */

let score = 0;

let correctCount = 0;

let round = 1;

let matched = 0;

let selectedProblem = null;

let selectedButton = null;

let endTime = 0;

let timer = null;

let gameOver = false;

let movingNextRound = false;


/* ==============================
   배열 랜덤 섞기
================================ */

function shuffle(array) {

    const copied = [...array];

    for (
        let i = copied.length - 1;
        i > 0;
        i--
    ) {

        const randomIndex =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            copied[i],
            copied[randomIndex]
        ]
        =
        [
            copied[randomIndex],
            copied[i]
        ];

    }

    return copied;
}


/* ==============================
   루트 표현
================================ */

function sqrtHTML(number) {

    return `
        <span class="sqrt">

            <span class="sqrt-symbol">
                √
            </span>

            <span class="radicand">
                ${number}
            </span>

        </span>
    `;
}


/* ==============================
   분수 표현
================================ */

function fractionHTML(
    numerator,
    denominator
) {

    return `
        <span class="frac">

            <span class="frac-top">
                ${numerator}
            </span>

            <span class="frac-bottom">
                ${denominator}
            </span>

        </span>
    `;
}


/* ==============================
   정답 수식 표시
================================ */

function answerHTML(key) {

    if (key === "half") {

        return `
            <span class="math">
                ${fractionHTML("1", "2")}
            </span>
        `;

    }


    if (key === "sqrt2half") {

        return `
            <span class="math">
                ${fractionHTML(
                    sqrtHTML("2"),
                    "2"
                )}
            </span>
        `;

    }


    if (key === "sqrt3half") {

        return `
            <span class="math">
                ${fractionHTML(
                    sqrtHTML("3"),
                    "2"
                )}
            </span>
        `;

    }


    if (key === "sqrt3third") {

        return `
            <span class="math">
                ${fractionHTML(
                    sqrtHTML("3"),
                    "3"
                )}
            </span>
        `;

    }


    if (key === "one") {

        return `
            <span class="math">
                1
            </span>
        `;

    }


    if (key === "sqrt3") {

        return `
            <span class="math">
                ${sqrtHTML("3")}
            </span>
        `;

    }

}


/* ==============================
   점수 계산

   0~2초  : 10점
   2~3초  : 9점
   3~4초  : 8점
   4~5초  : 7점
   5~6초  : 6점
   6초 초과 : 5점
================================ */

function calculateScore(seconds) {

    if (seconds <= 2) {

        return 10;

    }

    if (seconds <= 3) {

        return 9;

    }

    if (seconds <= 4) {

        return 8;

    }

    if (seconds <= 5) {

        return 7;

    }

    if (seconds <= 6) {

        return 6;

    }

    return 5;
}


/* ==============================
   점수 표시
================================ */

function updateScoreDisplay() {

    scoreElement.textContent =
        score;

    correctElement.textContent =
        correctCount;

}


/* ==============================
   문제 세트 생성
================================ */

function createRound() {

    matched = 0;

    selectedProblem = null;

    selectedButton = null;

    message.textContent = "";


    /*
        정답 값 6종류 중
        서로 다른 4개를 랜덤 선택
    */

    const selectedKeys =
        shuffle(answerKeys)
        .slice(0, 4);


    /*
        해당 값에 대응되는 문제 선택

        같은 값이 여러 문제를 갖는 경우
        하나를 랜덤 선택

        예:
        1/2
        → sin30°
        또는 cos60°
    */

    let selectedProblems =
        selectedKeys.map(key => {

            const candidates =
                problems.filter(
                    problem =>
                        problem.key === key
                );

            return candidates[
                Math.floor(
                    Math.random()
                    * candidates.length
                )
            ];

        });


    selectedProblems =
        shuffle(selectedProblems);


    /*
        오른쪽 정답 카드 순서도
        랜덤
    */

    const selectedAnswers =
        shuffle(selectedKeys);


    /*
        --------------------------
        폭탄 등장 확률
        --------------------------

        Math.random()은
        0 이상 1 미만

        0.05 = 5%
    */

    const bombAppears =
        Math.random() < 0.05;


    if (bombAppears) {

        /*
            왼쪽 네 자리 중
            한 곳 랜덤 선택
        */

        const bombIndex =
            Math.floor(
                Math.random() * 4
            );


        selectedProblems[
            bombIndex
        ] =
        {
            bomb: true
        };

    }


    leftCards.innerHTML = "";

    rightCards.innerHTML = "";


    /* ==============================
       왼쪽 문제 카드
    ================================ */

    selectedProblems.forEach(
        problem => {

            const button =
                document.createElement(
                    "button"
                );

            button.type = "button";

            button.className =
                "card";


            /* 폭탄 카드 */

            if (problem.bomb) {

                button.classList.add(
                    "bomb"
                );

                button.innerHTML =
                    `
                    💣
                    <span class="bomb-text">
                        폭탄
                    </span>
                    `;

                button.addEventListener(
                    "click",
                    () =>
                        activateBomb(button)
                );

            }

            /* 일반 카드 */

            else {

                button.textContent =
                    problem.expression;

                button.dataset.key =
                    problem.key;

                /*
                    카드 선택 시간을 저장

                    처음 누를 때부터
                    풀이 시간 측정
                */

                button.dataset.startTime =
                    "";

                button.addEventListener(
                    "click",
                    () =>
                        selectProblem(
                            button,
                            problem
                        )
                );

            }


            leftCards.appendChild(
                button
            );

        }
    );


    /* ==============================
       오른쪽 정답 카드
    ================================ */

    selectedAnswers.forEach(
        key => {

            const button =
                document.createElement(
                    "button"
                );

            button.type = "button";

            button.className =
                "card";

            button.dataset.key =
                key;

            button.innerHTML =
                answerHTML(key);

            button.addEventListener(
                "click",
                () =>
                    selectAnswer(
                        button,
                        key
                    )
            );


            rightCards.appendChild(
                button
            );

        }
    );


    roundElement.textContent =
        round + "세트";

}


/* ==============================
   문제 카드 선택
================================ */

function selectProblem(
    button,
    problem
) {

    if (
        gameOver ||
        movingNextRound ||
        button.disabled
    ) {

        return;

    }


    /*
        기존 선택 카드 표시 제거
    */

    leftCards
        .querySelectorAll(".card")
        .forEach(card => {

            card.classList.remove(
                "selected"
            );

        });


    /*
        처음 클릭했을 때만
        시간 기록

        다른 카드 눌렀다가
        다시 돌아와도
        시간은 초기화되지 않음
    */

    if (
        !button.dataset.startTime
    ) {

        button.dataset.startTime =
            Date.now();

    }


    selectedProblem =
        problem;

    selectedButton =
        button;


    button.classList.add(
        "selected"
    );


    message.textContent =
        "오른쪽에서 알맞은 값을 선택하세요.";

}


/* ==============================
   정답 카드 선택
================================ */

function selectAnswer(
    button,
    answerKey
) {

    if (
        gameOver ||
        movingNextRound ||
        button.disabled
    ) {

        return;

    }


    if (!selectedProblem) {

        message.textContent =
            "먼저 왼쪽 삼각비 카드를 선택하세요.";

        return;

    }


    /* ==========================
       정답
    ========================== */

    if (
        selectedProblem.key
        === answerKey
    ) {


        const startTime =
            Number(
                selectedButton
                .dataset
                .startTime
            );


        const elapsedTime =
            (
                Date.now()
                - startTime
            )
            / 1000;


        const earnedScore =
            calculateScore(
                elapsedTime
            );


        score +=
            earnedScore;

        correctCount++;

        matched++;


        updateScoreDisplay();


        selectedButton.disabled =
            true;

        button.disabled =
            true;


        selectedButton
            .classList
            .remove(
                "selected"
            );


        selectedButton
            .classList
            .add(
                "correct"
            );


        button
            .classList
            .add(
                "correct"
            );


        message.textContent =
            `✅ 정답! +${earnedScore}점 (${elapsedTime.toFixed(1)}초)`;


        selectedProblem =
            null;

        selectedButton =
            null;


        /*
            네 문제 모두 해결하면
            다음 세트
        */

        if (matched === 4) {

            nextRound();

        }

    }


    /* ==========================
       오답
    ========================== */

    else {


        /*
            제한시간 3초 감소
        */

        endTime -= 3000;


        message.textContent =
            "❌ 오답! 제한시간 -3초";


        /*
            흔들림 효과
        */

        button.classList.remove(
            "wrong"
        );

        void button.offsetWidth;

        button.classList.add(
            "wrong"
        );


        selectedButton
            .classList
            .remove(
                "wrong"
            );

        void selectedButton.offsetWidth;

        selectedButton
            .classList
            .add(
                "wrong"
            );


        updateTimer();

    }

}


/* ==============================
   폭탄
================================ */

function activateBomb(button) {

    if (
        gameOver ||
        movingNextRound
    ) {

        return;

    }


    /*
        현재 남아 있는 문제 개수
    */

    const remaining =
        4 - matched;


    /*
        폭탄 문제는
        각각 10점 처리
    */

    const bonus =
        remaining * 10;


    score += bonus;

    correctCount += remaining;

    matched = 4;


    updateScoreDisplay();


    /*
        모든 카드 비활성화
    */

    document
        .querySelectorAll(".card")
        .forEach(card => {

            card.disabled = true;

            card.classList.add(
                "correct"
            );

        });


    button.classList.remove(
        "correct"
    );


    message.textContent =
        `💥 폭탄! ${remaining}문제 자동 정답! +${bonus}점`;


    nextRound(600);

}


/* ==============================
   다음 세트
================================ */

function nextRound(
    delay = 400
) {

    if (
        movingNextRound ||
        gameOver
    ) {

        return;

    }


    movingNextRound = true;


    setTimeout(
        () => {

            if (!gameOver) {

                round++;

                createRound();

            }


            movingNextRound =
                false;

        },

        delay
    );

}


/* ==============================
   타이머
================================ */

function updateTimer() {

    if (gameOver) {

        return;

    }


    const remainingMilliseconds =
        endTime - Date.now();


    const remainingSeconds =
        Math.max(
            0,
            Math.ceil(
                remainingMilliseconds
                / 1000
            )
        );


    const minutes =
        Math.floor(
            remainingSeconds / 60
        );


    const seconds =
        remainingSeconds % 60;


    timeElement.textContent =
        minutes
        + ":"
        + String(seconds)
            .padStart(2, "0");


    /*
        제한시간 종료
    */

    if (
        remainingSeconds <= 0
    ) {

        finishGame();

    }

}


/* ==============================
   게임 종료
================================ */

function finishGame() {

    if (gameOver) {

        return;

    }


    gameOver = true;

    movingNextRound = false;


    clearInterval(timer);


    timeElement.textContent =
        "0:00";


    document
        .querySelectorAll(".card")
        .forEach(card => {

            card.disabled =
                true;

        });


    finalScore.textContent =
        score;

    finalCorrect.textContent =
        correctCount;


    result.classList.add(
        "show"
    );


    message.textContent =
        "";

}


/* ==============================
   게임 시작
================================ */

function startGame() {

    clearInterval(timer);


    score = 0;

    correctCount = 0;

    round = 1;

    matched = 0;

    selectedProblem =
        null;

    selectedButton =
        null;

    gameOver =
        false;

    movingNextRound =
        false;


    updateScoreDisplay();


    timeElement.textContent =
        "2:00";


    result.classList.remove(
        "show"
    );


    /*
        2분 = 120초
    */

    endTime =
        Date.now()
        + 120000;


    createRound();


    updateTimer();


    timer =
        setInterval(
            updateTimer,
            200
        );

}


/* ==============================
   버튼
================================ */

document
    .getElementById("restart")
    .addEventListener(
        "click",
        startGame
    );


document
    .getElementById("playAgain")
    .addEventListener(
        "click",
        startGame
    );


/* ==============================
   최초 실행
================================ */

startGame();

</script>

</body>
</html>
